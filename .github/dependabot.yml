version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tooling bumps instead of a dozen.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Cesium minors have shipped minifier-hostile chunks before (see
      # next.config.ts); bump it deliberately, with production screenshots.
      - dependency-name: cesium
        update-types: [version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
