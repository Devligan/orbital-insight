name: Refresh orbital data

# The deployment ships a build-time snapshot of the curated catalog (search
# and detail pages answer from it instantly, and it is the fallback when
# CelesTrak is unreachable). A snapshot is only as fresh as the last deploy,
# and past 7 days the app refuses to serve it — so a quiet repo would slowly
# lose its fallback. A daily rebuild keeps it fresh: one polite fetch of four
# small groups per day, from Vercel's build machines.
#
# Setup: Vercel → Project → Settings → Git → Deploy Hooks → create one for
# `main`, then store its URL as the repository secret VERCEL_DEPLOY_HOOK_URL.

on:
  schedule:
    - cron: "17 9 * * *" # daily, off the top of the hour
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger a production rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not set; skipping (see the setup note in this workflow)."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Rebuild requested."
