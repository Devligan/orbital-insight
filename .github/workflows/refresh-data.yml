name: Refresh orbital data

# The deployment carries two build-time snapshots: the curated catalog
# (src/server/search-index.static.json) and the whole active catalog
# (data/sky-catalog.snapshot.json). The app serves them with their true age
# and refuses them past a week, so they must be refreshed even when nobody
# pushes. Vercel's own machines can't be relied on for it: CelesTrak has
# answered them with HTTP 500 for the full-catalog query.
#
# Every two days this job fetches both snapshots on a GitHub runner (each
# script keeps the old copy if the provider refuses) and commits them if they
# changed; the push to main redeploys production through Vercel's Git
# integration. Two days keeps repository growth modest while the snapshots
# stay well inside the app's freshness horizon.

on:
  schedule:
    - cron: "17 9 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch snapshots (polite: one request per group, spaced)
        env:
          SEARCH_INDEX_FORCE_REFRESH: "1"
          SKY_SNAPSHOT_FORCE_REFRESH: "1"
        run: |
          node scripts/build-search-index.mjs
          node scripts/build-sky-snapshot.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data src/server/search-index.static.json; then
            echo "Snapshots unchanged (provider refused or nothing new)."
            exit 0
          fi
          git config user.name "orbital-insight-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data src/server/search-index.static.json
          git commit -m "Data: refresh orbital snapshots"
          git push
